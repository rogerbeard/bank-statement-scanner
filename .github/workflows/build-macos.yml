name: Build macOS DMG

on:
  # Run automatically on every push to main/master
  push:
    branches: [main, master]
    # Also run when you create a version tag (e.g. v1.0.0)
    tags:
      - 'v*'
  # Run manually from the GitHub Actions tab — no code push needed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-macos:
    name: Build macOS DMG (Universal)
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. poppler (PDF → image rendering) ───────────────────────────────────
      - name: Install poppler
        run: brew install poppler

      # ── 4. Root dependencies ─────────────────────────────────────────────────
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      # ── 5. Renderer dependencies ─────────────────────────────────────────────
      - name: Install renderer dependencies
        run: cd renderer && npm ci

      # ── 6. Build renderer ────────────────────────────────────────────────────
      - name: Build renderer (React + Vite)
        run: cd renderer && npm run build

      # ── 7. Generate ICNS icon from PNG ───────────────────────────────────────
      - name: Generate macOS ICNS icon
        run: |
          # Use macOS sips to resize the existing PNG into all required iconset sizes
          mkdir -p /tmp/icon.iconset
          sips -z 16   16   build-resources/icon.png --out /tmp/icon.iconset/icon_16x16.png
          sips -z 32   32   build-resources/icon.png --out /tmp/icon.iconset/icon_16x16@2x.png
          sips -z 32   32   build-resources/icon.png --out /tmp/icon.iconset/icon_32x32.png
          sips -z 64   64   build-resources/icon.png --out /tmp/icon.iconset/icon_32x32@2x.png
          sips -z 128  128  build-resources/icon.png --out /tmp/icon.iconset/icon_128x128.png
          sips -z 256  256  build-resources/icon.png --out /tmp/icon.iconset/icon_128x128@2x.png
          sips -z 256  256  build-resources/icon.png --out /tmp/icon.iconset/icon_256x256.png
          sips -z 512  512  build-resources/icon.png --out /tmp/icon.iconset/icon_256x256@2x.png
          sips -z 512  512  build-resources/icon.png --out /tmp/icon.iconset/icon_512x512.png
          cp build-resources/icon.png /tmp/icon.iconset/icon_512x512@2x.png
          iconutil -c icns /tmp/icon.iconset -o build-resources/icon.icns
          echo "ICNS created: $(ls -lh build-resources/icon.icns)"

      # ── 8. Build DMG (unsigned — no Apple Developer account required) ─────────
      - name: Build macOS DMG
        env:
          # Unsigned build: users bypass Gatekeeper via
          # System Settings → Privacy & Security → Open Anyway
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      # ── 9. List artifacts ────────────────────────────────────────────────────
      - name: List build output
        run: ls -lh dist-electron/

      # ── 10. Upload as downloadable artifact (available for 30 days) ──────────
      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bank-Statement-Scanner-macOS
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
          retention-days: 30
          if-no-files-found: error

      # ── 11. Create GitHub Release on version tags (e.g. git tag v1.0.0) ──────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Bank Statement Scanner ${{ github.ref_name }}
          body: |
            ## Bank Statement Scanner ${{ github.ref_name }}

            ### Download
            | Mac Type | File |
            |---|---|
            | Apple Silicon (M1/M2/M3/M4) | `*-arm64.dmg` |
            | Intel Mac | `*-x64.dmg` |

            ### Install
            1. Download the correct `.dmg` for your Mac
            2. Open it and drag **Bank Statement Scanner** to **Applications**
            3. First launch: **System Settings → Privacy & Security → Open Anyway**

            ### Features
            - Upload multiple bank statement PDFs
            - Draw capture regions (Page Header / Group Header / Detail Rows)
            - AI-powered transaction extraction (OpenAI / Anthropic / Ollama)
            - Editable data grid with Excel + CSV export
            - Dashboard with spending charts and balance timeline
          files: |
            dist-electron/*.dmg
            dist-electron/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
