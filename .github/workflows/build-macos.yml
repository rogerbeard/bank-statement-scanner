name: Build macOS DMG

on:
  # Run automatically on every push to main/master
  push:
    branches: [main, master]
    tags:
      - 'v*'
  # Run manually from the GitHub Actions tab — no code push needed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-macos:
    name: Build macOS DMG (Universal)
    runs-on: macos-latest
    permissions:
      contents: write   # required to create/update releases

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. poppler (PDF → image rendering) ───────────────────────────────────
      - name: Install poppler
        run: brew install poppler

      # ── 4. Root dependencies ─────────────────────────────────────────────────
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      # ── 5. Renderer dependencies ─────────────────────────────────────────────
      - name: Install renderer dependencies
        run: cd renderer && npm ci

      # ── 6. Build renderer ────────────────────────────────────────────────────
      - name: Build renderer (React + Vite)
        run: cd renderer && npm run build

      # ── 7. Generate ICNS icon from PNG ───────────────────────────────────────
      - name: Generate macOS ICNS icon
        run: |
          mkdir -p /tmp/icon.iconset
          sips -z 16   16   build-resources/icon.png --out /tmp/icon.iconset/icon_16x16.png
          sips -z 32   32   build-resources/icon.png --out /tmp/icon.iconset/icon_16x16@2x.png
          sips -z 32   32   build-resources/icon.png --out /tmp/icon.iconset/icon_32x32.png
          sips -z 64   64   build-resources/icon.png --out /tmp/icon.iconset/icon_32x32@2x.png
          sips -z 128  128  build-resources/icon.png --out /tmp/icon.iconset/icon_128x128.png
          sips -z 256  256  build-resources/icon.png --out /tmp/icon.iconset/icon_128x128@2x.png
          sips -z 256  256  build-resources/icon.png --out /tmp/icon.iconset/icon_256x256.png
          sips -z 512  512  build-resources/icon.png --out /tmp/icon.iconset/icon_256x256@2x.png
          sips -z 512  512  build-resources/icon.png --out /tmp/icon.iconset/icon_512x512.png
          cp build-resources/icon.png /tmp/icon.iconset/icon_512x512@2x.png
          iconutil -c icns /tmp/icon.iconset -o build-resources/icon.icns
          echo "ICNS created: $(ls -lh build-resources/icon.icns)"

      # ── 8. Determine version label ────────────────────────────────────────────
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="v${{ github.event.inputs.version }}"
          else
            VERSION="v1.0.0-build.$(date +'%Y%m%d%H%M%S')"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # ── 9. Build DMG (unsigned) ───────────────────────────────────────────────
      - name: Build macOS DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      # ── 10. List build output ─────────────────────────────────────────────────
      - name: List build output
        run: ls -lh dist-electron/

      # ── 11. Upload as artifact (30-day backup) ────────────────────────────────
      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bank-Statement-Scanner-macOS
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
          retention-days: 30
          if-no-files-found: error

      # ── 12. Delete existing 'latest' release if it exists ────────────────────
      - name: Delete existing latest release
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

      # ── 13. Publish GitHub Release (always — permanent direct download) ───────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Bank Statement Scanner {0}', github.ref_name) || 'Bank Statement Scanner — Latest Build' }}
          body: |
            ## Bank Statement Scanner — Latest Build

            Built automatically from the latest code on `main`.

            ### Download Your DMG

            | Mac Type | File to Download |
            |---|---|
            | **Apple Silicon** (M1 / M2 / M3 / M4) | `Bank Statement Scanner-1.0.0-arm64.dmg` |
            | **Intel Mac** | `Bank Statement Scanner-1.0.0-x64.dmg` |

            ### Install
            1. Download the `.dmg` for your Mac type above
            2. Open the `.dmg` → drag **Bank Statement Scanner** to **Applications**
            3. First launch only: go to **System Settings → Privacy & Security → Open Anyway**

            ### Features
            - Upload multiple bank statement PDFs
            - Draw capture regions (Page Header / Group Header / Detail Rows)
            - AI-powered transaction extraction (OpenAI / Anthropic / Ollama offline)
            - Editable data grid with inline cell editing
            - Combine or separate statement views
            - Excel (.xlsx) and CSV export
            - Dashboard with spending charts and balance over time

            ### AI Setup
            Open the app → **Settings** → choose your AI provider → enter API key → Save.
            Supports OpenAI, Anthropic Claude, and Ollama (fully offline).
          files: |
            dist-electron/*.dmg
            dist-electron/*.zip
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
